<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA二重らせん 回転アニメーション</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center p-4">
<h1 class="text-2xl font-bold mt-4 mb-1 text-cyan-300">🧬 DNA二重らせん 回転アニメーション</h1>
<p class="text-gray-400 mb-3 text-sm">DNA二重らせん構造を3D投影でCanvas回転描画。塩基対（A-T/G-C）色分け</p>

<div class="flex gap-3 mb-3 flex-wrap justify-center text-sm">
  <label>回転速度:
    <input type="range" id="speed" min="1" max="30" value="10" class="ml-1 w-20">
    <span id="speedVal" class="text-cyan-300 ml-1">10</span>
  </label>
  <label>ズーム:
    <input type="range" id="zoom" min="50" max="200" value="100" class="ml-1 w-20">
    <span id="zoomVal" class="text-cyan-300 ml-1">1.0x</span>
  </label>
  <label class="flex items-center gap-1">
    <input type="checkbox" id="showLabels" checked> 塩基ラベル
  </label>
  <button id="btnPause" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded">⏸</button>
</div>

<canvas id="dnaCanvas" width="500" height="550" class="border border-gray-700 rounded w-full max-w-sm">お使いのブラウザはCanvasに対応していません</canvas>

<div class="mt-3 grid grid-cols-2 md:grid-cols-4 gap-2 text-xs w-full max-w-sm">
  <div class="bg-gray-800 rounded p-2 flex items-center gap-2">
    <div class="w-3 h-3 rounded-full bg-red-500"></div>
    <span>アデニン (A)</span>
  </div>
  <div class="bg-gray-800 rounded p-2 flex items-center gap-2">
    <div class="w-3 h-3 rounded-full bg-blue-400"></div>
    <span>チミン (T)</span>
  </div>
  <div class="bg-gray-800 rounded p-2 flex items-center gap-2">
    <div class="w-3 h-3 rounded-full bg-green-400"></div>
    <span>グアニン (G)</span>
  </div>
  <div class="bg-gray-800 rounded p-2 flex items-center gap-2">
    <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
    <span>シトシン (C)</span>
  </div>
</div>
<p class="text-xs text-gray-500 mt-2">A-T は2本水素結合、G-C は3本水素結合</p>

<script>
const canvas = document.getElementById('dnaCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const BASE_COLORS = {
  A: '#EF4444',
  T: '#60A5FA',
  G: '#34D399',
  C: '#FBBF24',
};

const PAIRS = [
  ['A', 'T'], ['G', 'C'], ['C', 'G'], ['T', 'A'],
  ['A', 'T'], ['G', 'C'], ['T', 'A'], ['C', 'G'],
  ['A', 'T'], ['G', 'C'], ['A', 'T'], ['T', 'A'],
  ['C', 'G'], ['G', 'C'],
];

let angle = 0;
let paused = false;
let animId = null;

document.getElementById('speed').addEventListener('input', function() {
  document.getElementById('speedVal').textContent = this.value;
});
document.getElementById('zoom').addEventListener('input', function() {
  document.getElementById('zoomVal').textContent = (parseInt(this.value)/100).toFixed(1) + 'x';
});

document.getElementById('btnPause').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? '▶' : '⏸';
  if (!paused) requestAnimationFrame(draw);
});

function draw(timestamp) {
  if (!paused) {
    const speed = parseInt(document.getElementById('speed').value) / 1000;
    angle += speed;
  }

  const zoom = parseInt(document.getElementById('zoom').value) / 100;
  const showLabels = document.getElementById('showLabels').checked;
  const N = PAIRS.length;

  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2;
  const helixR = 90 * zoom;
  const stepH = 32 * zoom;
  const totalH = N * stepH;
  const startY = (H - totalH) / 2 + stepH / 2;

  // Sort by z-depth for correct rendering
  const segments = [];
  for (let i = 0; i < N; i++) {
    const y = startY + i * stepH;
    const twist = angle + (i / N) * Math.PI * 4; // 2 full turns

    // Strand 1 (left)
    const x1 = cx + helixR * Math.cos(twist);
    const z1 = helixR * Math.sin(twist);

    // Strand 2 (right, opposite phase)
    const x2 = cx + helixR * Math.cos(twist + Math.PI);
    const z2 = helixR * Math.sin(twist + Math.PI);

    segments.push({ type: 'pair', i, y, x1, z1, x2, z2, twist });
  }

  // Sort by average z (painter's algorithm for pairs)
  segments.sort((a, b) => (a.z1 + a.z2) / 2 - (b.z1 + b.z2) / 2);

  segments.forEach(seg => {
    const { i, y, x1, z1, x2, z2, twist } = seg;
    const pair = PAIRS[i];
    const depth1 = (z1 + helixR) / (2 * helixR);
    const depth2 = (z2 + helixR) / (2 * helixR);

    // Sugar-phosphate backbone connections
    if (i < N - 1) {
      const twist2 = angle + ((i+1) / N) * Math.PI * 4;
      const nx1 = cx + helixR * Math.cos(twist2);
      const nz1 = helixR * Math.sin(twist2);
      const nx2 = cx + helixR * Math.cos(twist2 + Math.PI);

      ctx.strokeStyle = `rgba(180, 180, 255, ${0.4 + depth1 * 0.4})`;
      ctx.lineWidth = 3 * zoom;
      ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(nx1, y + stepH); ctx.stroke();

      ctx.strokeStyle = `rgba(255, 180, 180, ${0.4 + depth2 * 0.4})`;
      ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(nx2, y + stepH); ctx.stroke();
    }

    // Base pair connection (hydrogen bonds)
    const drawBond = Math.abs(z1) < helixR * 0.95;
    if (drawBond) {
      const dashAlpha = 0.3 + ((z1 + helixR) / (2 * helixR)) * 0.4;
      ctx.strokeStyle = `rgba(255, 255, 255, ${dashAlpha})`;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Base nodes
    [[x1, z1, depth1, pair[0]], [x2, z2, depth2, pair[1]]].forEach(([bx, bz, depth, base]) => {
      const r = (7 + depth * 4) * zoom;
      const alpha = 0.5 + depth * 0.5;
      const color = BASE_COLORS[base];

      const grd = ctx.createRadialGradient(bx - r*0.3, y - r*0.3, 0, bx, y, r);
      grd.addColorStop(0, color);
      grd.addColorStop(1, color + '44');
      ctx.fillStyle = grd;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(bx, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      if (showLabels && r > 5 * zoom) {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.round(9 * zoom)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(base, bx, y);
      }
    });
  });

  if (!paused) animId = requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
